<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MirrorPhone — prueba de vídeo</title><link rel="stylesheet" href="/style.css"><script src="/test-sender.js" defer></script></head><body><main><p class="eyebrow">DIAGNÓSTICO LOCAL</p><h1>Prueba de vídeo</h1><p>Este patrón animado comprueba WebRTC sin capturar ningún dispositivo. No es la pantalla de tu iPhone.</p><div class="test"><input id="code" aria-label="Código de sala" placeholder="Código del receptor" maxlength="6"><button id="start">Transmitir prueba</button><button id="stop" disabled>Detener</button><select id="rate" aria-label="FPS de prueba"><option value="30">30 FPS</option><option value="60">60 FPS</option></select></div><canvas id="pattern" width="1920" height="1080"></canvas><p id="state" role="status">Sin conectar</p><p id="error" class="error" role="alert"></p></main></body></html>
