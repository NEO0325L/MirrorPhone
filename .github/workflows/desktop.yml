name: Build desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node ../cloudflare/check-worker.mjs
      - run: npm run build:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorPhone-${{ matrix.target }}-x64
          path: |
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
